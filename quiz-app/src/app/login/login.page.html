<ion-content class="login-container">
  <div class="login-card">
    <div class="logo-section">
      <img src="assets/logo.svg" alt="QuizCash Logo" class="login-logo" />
      <h1 class="login-title">QuizCash</h1>
      <p class="login-subtitle">Login to earn with your knowledge</p>
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <ion-item class="input-item">
        <ion-label position="floating">Email</ion-label>
        <ion-input type="email" formControlName="email"></ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        <p *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</p>
        <p *ngIf="loginForm.get('email')?.errors?.['email']">Enter a valid email.</p>
      </ion-text>

      <ion-item class="input-item">
        <ion-label position="floating">Password</ion-label>
        <ion-input type="password" formControlName="password"></ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <p *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</p>
        <p *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters.</p>
      </ion-text>

      <ion-text color="danger" *ngIf="errorMessage">
        <p>{{ errorMessage }}</p>
      </ion-text>

      <ion-button expand="block" type="submit" class="login-btn" [disabled]="loading">Login</ion-button>
      <ion-button expand="block" fill="clear" class="switch-btn" [routerLink]="['/register']">Don't have an account? Register</ion-button>
    </form>
  </div>
</ion-content>
