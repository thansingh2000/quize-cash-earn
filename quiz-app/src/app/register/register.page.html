<ion-content class="register-container">
  <div class="register-card">
    <div class="logo-section">
      <img src="assets/logo.svg" alt="QuizCash Logo" class="register-logo" />
      <h1 class="register-title">QuizCash</h1>
      <p class="register-subtitle">Create your account to start earning</p>
    </div>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <ion-item class="input-item">
        <ion-label position="floating">Name</ion-label>
        <ion-input type="text" formControlName="name"></ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">
        <p *ngIf="registerForm.get('name')?.errors?.['required']">Name is required.</p>
        <p *ngIf="registerForm.get('name')?.errors?.['minlength']">Name must be at least 2 characters.</p>
      </ion-text>

      <ion-item class="input-item">
        <ion-label position="floating">Email</ion-label>
        <ion-input type="email" formControlName="email"></ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
        <p *ngIf="registerForm.get('email')?.errors?.['required']">Email is required.</p>
        <p *ngIf="registerForm.get('email')?.errors?.['email']">Enter a valid email.</p>
      </ion-text>

      <ion-item class="input-item">
        <ion-label position="floating">Password</ion-label>
        <ion-input type="password" formControlName="password"></ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
        <p *ngIf="registerForm.get('password')?.errors?.['required']">Password is required.</p>
        <p *ngIf="registerForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters.</p>
      </ion-text>

      <ion-text color="danger" *ngIf="errorMessage">
        <p>{{ errorMessage }}</p>
      </ion-text>

      <ion-button expand="block" type="submit" class="register-btn" [disabled]="loading">Register</ion-button>
      <ion-button expand="block" fill="clear" class="switch-btn" [routerLink]="['/login']">Already have an account? Login</ion-button>
    </form>
  </div>
</ion-content>
